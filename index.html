<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="知识点卡片">
  <meta name="theme-color" content="#ede8df">
  <title>知识点卡片</title>
  <style>
/* ===== RESET ===== */
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
:root {
  --bg:       #ede8df;
  --bg-card:  #faf7f2;
  --ink:      #2a231a;
  --ink-mid:  #6b5f52;
  --ink-soft: #a0948a;
  --ring-c:   rgba(42,35,26,0.18);
  --shadow:   0 6px 24px rgba(90,70,50,0.13);
  --shadow-sm:0 2px 8px rgba(90,70,50,0.10);
  /* per-notebook, overridden inline on card-paper */
  --accent:      #7a8fa0;
  --accent-bg:   rgba(122,143,160,0.13);
  --accent-rev:  #4e6a7e;
}
html,body { height:100%; overflow:hidden; background:var(--bg);
  font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif; }
/* 动态米白大背景：柔光呼吸 */
body::before {
  content:''; position:fixed; inset:-20%;
  z-index:0; pointer-events:none;
  background:
    radial-gradient(ellipse 45% 35% at 22% 8%,  rgba(226,216,198,0.16), transparent 65%),
    radial-gradient(ellipse 40% 32% at 85% 18%, rgba(214,200,180,0.13), transparent 65%),
    radial-gradient(ellipse 50% 40% at 12% 92%, rgba(222,210,190,0.11), transparent 65%),
    radial-gradient(ellipse 45% 38% at 90% 88%, rgba(228,216,198,0.14), transparent 65%);
  animation: breath 16s ease-in-out infinite alternate;
}
@keyframes breath {
  0%   { transform:translate(0,0) scale(1); opacity:.92; }
  100% { transform:translate(-1.5%,1.2%) scale(1.045); opacity:1; }
}
#app { height:100%; display:flex; flex-direction:column; position:relative; z-index:1; }

/* ===== AUTH ===== */
#auth-view {
  flex:1; display:flex; align-items:center; justify-content:center;
  padding:30px 20px;
}
.auth-box {
  width:100%; max-width:380px;
  background:var(--bg-card); border-radius:18px;
  box-shadow:var(--shadow); padding:34px 30px 28px;
  animation:sheetup .3s ease;
}
.auth-logo { text-align:center; font-size:22px; font-weight:800; color:var(--ink); letter-spacing:2px; margin-bottom:4px; }
.auth-sub { text-align:center; font-size:12px; color:var(--ink-soft); margin-bottom:22px; }
.auth-input {
  width:100%; padding:13px 14px; margin-bottom:12px;
  border:1.5px solid rgba(42,35,26,0.14); border-radius:10px;
  background:var(--bg-card); color:var(--ink);
  font-size:14px; box-sizing:border-box;
}
.auth-input:focus { outline:none; border-color:var(--accent); }
.auth-btn {
  width:100%; padding:13px 0; border-radius:24px; border:none; cursor:pointer;
  font-size:15px; font-weight:700; margin-top:6px;
  background:var(--accent); color:#fff; letter-spacing:1px;
  transition:opacity .15s;
}
.auth-btn:active { opacity:.8; }
.auth-msg { margin-top:12px; font-size:12.5px; color:#7a3e3e; min-height:18px; line-height:1.6; }
.auth-toggle { text-align:center; margin-top:14px; font-size:13px; color:var(--ink-mid); }
.auth-toggle a { color:var(--accent); font-weight:600; cursor:pointer; text-decoration:none; }

/* ===== HOME ===== */
#home-view {
  flex:1; overflow-y:auto; background:var(--bg);
  padding:0 0 40px;
}
.title-edit { font-size:13px; margin-left:6px; color:var(--ink-soft); opacity:.8; }
.home-header {
  padding:52px 24px 14px; text-align:center;
}
.home-title {
  font-size:24px; font-weight:800; color:var(--ink);
  letter-spacing:3px;
}
.home-countdown {
  display:inline-block; margin-top:8px;
  font-size:13px; font-weight:700; letter-spacing:1px;
  color:var(--ink-mid);
  background:rgba(42,35,26,0.06);
  border-radius:16px; padding:5px 14px;
}
.home-countdown.hot { background:rgba(176,112,112,0.13); color:#7a3e3e; }
.user-bar {
  display:inline-flex; align-items:center; gap:6px;
  margin-top:10px; padding:5px 13px; border-radius:16px;
  background:rgba(42,35,26,0.05); color:var(--ink-mid);
  font-size:12px; cursor:pointer; user-select:none;
}
.user-bar:active { background:rgba(42,35,26,0.10); }
.user-dot { width:7px; height:7px; border-radius:50%; background:#6f8f6f; flex-shrink:0; box-shadow:0 0 0 3px rgba(111,143,111,0.18); }
.user-email { font-weight:700; color:var(--ink); max-width:140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.notebook-grid {
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:12px; padding:8px 14px;
  max-width:1200px; margin:0 auto;
}
@media (min-width:560px)  { .notebook-grid { grid-template-columns:repeat(3, 1fr); gap:14px; padding:10px 18px; } }
@media (min-width:820px)  { .notebook-grid { grid-template-columns:repeat(4, 1fr); } }
@media (min-width:1080px) { .notebook-grid { grid-template-columns:repeat(5, 1fr); } }
@media (min-width:1320px) { .notebook-grid { grid-template-columns:repeat(6, 1fr); } }

/* Notebook card — light textured cover */
.notebook-card {
  border-radius:12px; overflow:hidden; cursor:pointer;
  box-shadow:var(--shadow);
  transition:transform .18s ease, box-shadow .18s ease;
  position:relative;
  background:var(--bg-card);
  border:1px solid rgba(42,35,26,0.06);
}
.notebook-card:active { transform:scale(0.95); box-shadow:var(--shadow-sm); }
.notebook-card::after { /* texture weave */
  content:''; position:absolute; inset:0; pointer-events:none;
  opacity:.5; mix-blend-mode:multiply;
  background-image:
    repeating-linear-gradient(0deg, var(--cover-tint) 0 1px, transparent 1px 7px),
    repeating-linear-gradient(90deg, var(--cover-tint) 0 1px, transparent 1px 7px);
  background-size:7px 7px;
}
.notebook-cover {
  padding:18px 16px 14px;
  display:flex; flex-direction:column; justify-content:space-between;
  min-height:118px; position:relative; z-index:1;
}
@media (min-width:1080px) { .notebook-cover { min-height:128px; } }
.notebook-label {
  font-size:17px; font-weight:800; line-height:1.3;
  color:var(--cover-dark);
  letter-spacing:.5px;
  text-shadow:0 1px 0 rgba(255,255,255,0.4);
}
.notebook-count { font-size:11.5px; color:var(--cover-mid); margin-top:5px; }
.notebook-progress-track {
  height:4px; background:var(--cover-track);
  border-radius:2px; overflow:hidden;
}
.notebook-progress-fill {
  height:100%; background:var(--cover-dark);
  border-radius:2px; transition:width .4s ease;
  opacity:.65;
}
.mastered-card { grid-column:1/-1; min-height:72px; }
.mastered-card .notebook-cover {
  flex-direction:row; align-items:center; min-height:72px;
}
.mastered-card .notebook-info { flex:1; }

.add-fab {
  display:inline-block; margin-top:12px;
  padding:8px 18px; border-radius:20px; border:none; cursor:pointer;
  background:rgba(42,35,26,0.07); color:var(--ink-mid);
  font-size:13px; font-weight:600; letter-spacing:.5px;
  transition:background .15s;
}
.add-fab:active { background:rgba(42,35,26,0.14); }

/* ===== CARD VIEW ===== */
#card-view {
  flex:1; display:flex; flex-direction:column;
  background:linear-gradient(rgba(237,232,223,0.82), rgba(237,232,223,0.82));
}

/* Header */
.card-header {
  display:flex; align-items:center; gap:12px;
  padding:50px 16px 10px;
}
.back-btn {
  width:36px; height:36px; border-radius:50%; border:none; cursor:pointer;
  background:rgba(42,35,26,0.08); color:var(--ink); font-size:18px;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0; transition:background .15s;
}
.back-btn:active { background:rgba(42,35,26,0.15); }
.card-subject { font-size:16px; font-weight:700; color:var(--ink); flex:1; }

/* Card paper */
.card-scroll { flex:1; overflow-y:auto; padding:0 16px 16px; }
.card-paper {
  background:var(--bg-card);
  border-radius:10px 10px 8px 8px;
  box-shadow:var(--shadow);
  overflow:hidden;
  min-height:380px;
  transition:opacity .14s ease, transform .14s ease;
}
.card-paper.slide-out-left  { opacity:0; transform:translateX(-28px); }
.card-paper.slide-out-right { opacity:0; transform:translateX(28px); }

.card-title-bar {
  padding:14px 18px 12px;
  display:flex; align-items:center; justify-content:space-between;
  position:relative;
}
.card-title-bar::after {
  content:'';
  position:absolute; bottom:0; left:0; right:0; height:3px;
  background:rgba(0,0,0,0.08);
}
.card-title { font-size:17px; font-weight:700; color:#fff; flex:1; line-height:1.4; }

.card-body { padding:18px 18px 16px; }
.section-label {
  font-size:10.5px; font-weight:600; letter-spacing:1.8px;
  color:var(--ink-soft); margin-bottom:8px; text-transform:uppercase;
}
.definition-text {
  font-size:16px; line-height:2; color:var(--ink); margin-bottom:18px;
}
.example-box {
  background:rgba(42,35,26,0.04);
  border-left:3px solid var(--accent);
  padding:11px 14px; border-radius:0 8px 8px 0;
}
.example-text { font-size:14px; line-height:1.85; color:var(--ink-mid); }

/* ===== BLANKS ===== */
.blank {
  display:inline-block; cursor:pointer;
  border-bottom:2px solid var(--accent);
  border-radius:2px;
  padding:0 3px;
  min-width:2.2em;
  background:var(--accent-bg);
  color:transparent;
  transition:background .18s, color .18s, border-color .18s;
  user-select:none;
  position:relative;
}
.blank::before {
  content:attr(data-dashes);
  color:var(--accent);
  font-weight:700;
  letter-spacing:1px;
  font-size:0.95em;
}
.blank.revealed {
  color:var(--accent-rev);
  background:rgba(0,0,0,0.04);
  border-bottom-color:var(--accent-rev);
}
.blank.revealed::before { content:''; }

/* ===== CONTROLS ===== */
.card-controls {
  padding:11px 16px 14px;
  border-top:1px solid rgba(42,35,26,0.07);
  display:flex; align-items:center; gap:10px;
}
.reveal-toggle-btn {
  font-size:12px; padding:5px 11px; border-radius:20px; border:none; cursor:pointer;
  background:rgba(42,35,26,0.07); color:var(--ink-mid); font-weight:500;
  flex-shrink:0; transition:background .15s;
}
.reveal-toggle-btn:active { background:rgba(42,35,26,0.14); }

.star-row { display:flex; gap:2px; flex:1; justify-content:center; }
.star {
  font-size:22px; cursor:pointer;
  color:rgba(42,35,26,0.15);
  transition:color .15s, transform .1s; line-height:1;
}
.star.on { color:#c8a040; }
.star:active { transform:scale(1.35); }

.discard-btn {
  font-size:12px; padding:5px 11px; border-radius:20px; border:none; cursor:pointer;
  background:rgba(42,35,26,0.07); color:var(--ink-mid); font-weight:500;
  flex-shrink:0; transition:background .15s;
}
.discard-btn:active { background:rgba(42,35,26,0.14); }
.discard-btn.restore {
  background:rgba(80,120,80,0.1); color:#4e7050;
}

/* ===== BOTTOM NAV ===== */
.card-nav {
  display:flex; align-items:center; padding:8px 20px 26px; gap:14px;
  background:var(--bg);
  border-top:1px solid rgba(42,35,26,0.06);
}
.nav-btn {
  width:46px; height:46px; border-radius:50%; border:none; cursor:pointer;
  background:rgba(42,35,26,0.07); color:var(--ink); font-size:22px;
  display:flex; align-items:center; justify-content:center;
  transition:background .15s; flex-shrink:0;
}
.nav-btn:disabled { opacity:0.2; cursor:default; }
.nav-btn:not(:disabled):active { background:rgba(42,35,26,0.14); }
.nav-slider {
  flex:1; display:flex; align-items:center; gap:10px;
}
.nav-slider input[type=range] {
  -webkit-appearance:none; appearance:none;
  flex:1; height:4px; border-radius:2px; cursor:pointer;
  background:linear-gradient(to right, var(--accent) 0%, var(--accent) var(--fill,0%), rgba(42,35,26,0.13) var(--fill,0%));
  outline:none;
}
.nav-slider input[type=range]::-webkit-slider-thumb {
  -webkit-appearance:none; appearance:none;
  width:20px; height:20px; border-radius:50%;
  background:var(--accent); border:3px solid var(--bg-card);
  box-shadow:0 1px 5px rgba(0,0,0,0.22);
}
.nav-slider input[type=range]::-moz-range-thumb {
  width:14px; height:14px; border-radius:50%;
  background:var(--accent); border:3px solid var(--bg-card);
  box-shadow:0 1px 5px rgba(0,0,0,0.22);
}
.nav-count { font-size:11.5px; color:var(--ink-soft); min-width:38px; text-align:center; flex-shrink:0; }

/* Swipe hint */
.swipe-hint {
  text-align:center; font-size:11px; color:var(--ink-soft);
  padding:2px 0 0; letter-spacing:.5px;
  opacity:1; animation:fadehint 3s ease 1.5s forwards;
}
@keyframes fadehint { to { opacity:0; } }

/* Empty state */
.empty-state {
  display:flex; flex-direction:column; align-items:center;
  padding:60px 24px; text-align:center;
}
.empty-icon { font-size:48px; margin-bottom:16px; }
.empty-msg { font-size:15px; line-height:1.7; color:var(--ink-mid); }

/* Scrollbar */
::-webkit-scrollbar { width:3px; }
::-webkit-scrollbar-thumb { background:rgba(42,35,26,0.12); border-radius:2px; }

/* Safe area */
@supports (padding:env(safe-area-inset-bottom)) {
  .card-nav { padding-bottom:max(28px, env(safe-area-inset-bottom)); }
  .card-header { padding-top:max(50px, calc(env(safe-area-inset-top)+14px)); }
  .home-header { padding-top:max(52px, calc(env(safe-area-inset-top)+20px)); }
}

/* ===== ADD MODAL ===== */
#add-modal {
  position:fixed; inset:0; z-index:60;
  display:none; align-items:flex-end; justify-content:center;
  background:rgba(42,35,26,0.35);
  backdrop-filter:blur(2px);
}
#add-modal.show { display:flex; }
.add-sheet {
  background:var(--bg-card); width:100%;
  border-radius:18px 18px 0 0;
  max-height:88vh;
  display:flex; flex-direction:column;
  box-shadow:0 -8px 30px rgba(90,70,50,0.18);
  animation:sheetup .22s ease;
}
@keyframes sheetup { from { transform:translateY(40px); opacity:0; } to { transform:translateY(0); opacity:1; } }
.add-head {
  display:flex; align-items:center; justify-content:space-between;
  padding:18px 20px 10px;
}
.add-head .t { font-size:16px; font-weight:700; color:var(--ink); }
.add-close {
  width:30px; height:30px; border-radius:50%; border:none; cursor:pointer;
  background:rgba(42,35,26,0.07); color:var(--ink-mid); font-size:14px;
}
.add-scroll { flex:1; overflow-y:auto; padding:0 20px 20px; }
.add-hint {
  font-size:12px; line-height:1.7; color:var(--ink-soft);
  background:rgba(42,35,26,0.04);
  border-radius:8px; padding:10px 12px; margin-bottom:12px;
}
#add-input {
  width:100%; min-height:160px;
  border:1.5px solid rgba(42,35,26,0.15); border-radius:10px;
  background:var(--bg-card); color:var(--ink);
  font-size:14px; line-height:1.7; font-family:inherit;
  padding:12px; resize:vertical;
}
#add-input:focus { outline:none; border-color:var(--accent); }
.add-actions {
  display:flex; gap:10px; margin-top:12px;
}
.add-actions button {
  flex:1; padding:11px 0; border-radius:24px; border:none; cursor:pointer;
  font-size:14px; font-weight:600;
  background:rgba(42,35,26,0.07); color:var(--ink-mid);
  transition:background .15s;
}
.add-actions button:active { background:rgba(42,35,26,0.14); }
.add-actions button.primary {
  background:var(--accent); color:#fff;
}
.add-actions button.primary:active { opacity:.8; }
.add-msg {
  margin-top:10px; font-size:12.5px; color:#4e7050; line-height:1.6;
}
.add-existing-title {
  margin-top:18px; font-size:13px; font-weight:700; color:var(--ink-mid);
}
.add-existing {
  margin-top:8px; display:flex; flex-direction:column; gap:8px;
}
.add-item {
  display:flex; align-items:center; gap:8px;
  background:rgba(42,35,26,0.04); border-radius:8px; padding:9px 12px;
}
.add-item .info { flex:1; min-width:0; }
.add-item .info .t {
  font-size:13.5px; font-weight:600; color:var(--ink);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.add-item .info .s { font-size:11px; color:var(--ink-soft); margin-top:2px; }
.add-del {
  width:26px; height:26px; border-radius:50%; border:none; cursor:pointer;
  background:rgba(176,112,112,0.15); color:#7a3e3e; font-size:13px;
  flex-shrink:0;
}
.add-input {
  width:100%; padding:12px;
  border:1.5px solid rgba(42,35,26,0.15); border-radius:10px;
  background:var(--bg-card); color:var(--ink);
  font-size:14px; box-sizing:border-box;
}
.add-input:focus { outline:none; border-color:var(--accent); }

/* ===== NEW NOTEBOOK MODAL ===== */
.modal-mask {
  position:fixed; inset:0; z-index:70;
  display:flex; align-items:center; justify-content:center;
  background:rgba(42,35,26,0.35); backdrop-filter:blur(2px);
}
.modal-box {
  width:86%; max-width:340px;
  background:var(--bg-card); border-radius:16px;
  padding:24px 22px;
  box-shadow:var(--shadow);
  animation:sheetup .2s ease;
}
.modal-title { font-size:16px; font-weight:700; color:var(--ink); margin-bottom:8px; }

.system-tools { padding:2px 16px 10px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.system-tools select { flex:1; min-width:180px; min-height:38px; border:1px solid rgba(42,35,26,.15); border-radius:9px; padding:5px; background:var(--bg-card); color:var(--ink-mid); font-size:12px; }
.system-tools input[type=date] { padding:8px; border:1px solid rgba(42,35,26,.15); border-radius:9px; background:var(--bg-card); color:var(--ink-mid); }
.system-actions { display:flex; gap:6px; }
.system-actions button { border:0; border-radius:18px; padding:8px 11px; background:rgba(42,35,26,.07); color:var(--ink-mid); font-size:12px; }
.system-actions button:last-child { background:var(--accent); color:#fff; }

.system-tools { padding:2px 16px 10px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.system-tools select { width:auto; min-width:130px; max-width:200px; padding:7px 8px; border:1px solid rgba(42,35,26,.15); border-radius:9px; background:var(--bg-card); color:var(--ink-mid); font-size:12.5px; }
.date-range { display:flex; align-items:center; gap:6px; }
.date-range input[type=date] { padding:6px 7px; border:1px solid rgba(42,35,26,.15); border-radius:9px; background:var(--bg-card); color:var(--ink-mid); font-size:12px; }
.date-range span { color:var(--ink-soft); font-size:11px; }
.system-tools .sys-go { border:0; border-radius:18px; padding:8px 14px; background:var(--accent); color:#fff; font-size:12.5px; cursor:pointer; }
.system-tools .sys-go:active { opacity:.8; }

.ai-prompt-box { margin:22px 16px 0; padding:16px; border-radius:14px; background:rgba(250,247,242,.75); border:1px dashed rgba(42,35,26,.2); }
.ai-prompt-title { font-size:13px; font-weight:700; color:var(--ink-mid); margin-bottom:10px; }
.ai-prompt-text { width:100%; min-height:110px; border:1px solid rgba(42,35,26,.15); border-radius:10px; background:var(--bg-card); color:var(--ink); font-size:12.5px; line-height:1.75; padding:11px; resize:vertical; font-family:inherit; }
.ai-prompt-text.copied { border-color:#6f8f6f; }
.ai-prompt-copy { margin-top:9px; border:0; border-radius:16px; padding:7px 15px; background:rgba(42,35,26,.07); color:var(--ink-mid); font-size:12px; cursor:pointer; }
.ai-prompt-copy:active { background:rgba(42,35,26,.13); }

/* ===== Mastered celebration ===== */
.celebrate-overlay {
  position:fixed; inset:0; z-index:80;
  pointer-events:none;
  display:flex; align-items:center; justify-content:center;
}
.celebrate-pop {
  font-size:34px; font-weight:800; color:var(--accent-rev);
  letter-spacing:2px;
  background:rgba(250,247,242,0.9);
  border-radius:18px; padding:14px 24px;
  box-shadow:var(--shadow);
  animation:popanim 1s ease forwards;
}
@keyframes popanim {
  0%   { transform:scale(.4); opacity:0; }
  25%  { transform:scale(1.15); opacity:1; }
  60%  { transform:scale(1); opacity:1; }
  100% { transform:scale(1.05) translateY(-14px); opacity:0; }
}
.paper-exit {
  transition:transform .35s ease, opacity .35s ease;

  pointer-events:none;
}

  transition:opacity .25s ease;

}

<body>
<div id="app">
  <!-- AUTH VIEW (registration/login) -->
  <div id="auth-view" style="display:none">
    <div class="auth-box">
      <div class="auth-logo">知识点笔记本</div>
      <div class="auth-sub">从零开始，建立自己的笔记本</div>
      <input id="auth-email" class="auth-input" type="email" placeholder="邮箱" autocomplete="email">
      <input id="auth-pass" class="auth-input" type="password" placeholder="密码（至少6位）" autocomplete="new-password">
      <button class="auth-btn" id="auth-submit" onclick="authSubmit()">注册并登录</button>
      <div class="auth-msg" id="auth-msg"></div>
      <div class="auth-toggle">已有账号？<a onclick="authToggle()">直接登录</a></div>
    </div>
  </div>

  <!-- HOME VIEW -->
  <div id="home-view" style="display:none"></div>
  <!-- CARD VIEW -->
  <div id="card-view" style="display:none"></div>

  <!-- ADD CARD MODAL -->
  <div id="add-modal">
    <div class="add-sheet">
      <div class="add-head">
        <div class="t">添加知识点</div>
        <button class="add-close" onclick="closeAdd()">✕</button>
      </div>
      <div class="add-scroll">
        <div class="add-hint">格式如下，多个知识点用<b>空行</b>分隔；定义中可用 <b>{{挖空}}</b> 标记考点：<br>
        笔记本: 刑法<br>知识点: 教唆犯<br>定义: 故意唆使他人实施{{犯罪}}的人…<br>例子: 甲唆使乙盗窃…</div>
        <textarea id="add-input" placeholder="笔记本: 刑法
知识点: 教唆犯
定义: 故意唆使他人实施{{犯罪}}的人，按其在共同犯罪中的{{作用}}处罚。
例子: 甲唆使乙盗窃，甲为教唆犯。

笔记本: 法理学
知识点: 法律关系
定义: ..."></textarea>
        <div class="add-actions">
          <button class="primary" onclick="parseAndAdd()">解析并添加</button>
        </div>
        <div class="add-msg" id="add-msg"></div>
        <div class="add-existing-title">已添加的卡片</div>
        <div class="add-existing" id="add-existing"></div>
      </div>
    </div>
  </div>

  <!-- NEW NOTEBOOK MODAL -->
  <div id="nb-modal" class="modal-mask" style="display:none">
    <div class="modal-box">
      <div class="modal-title">新建笔记本</div>
      <div class="add-hint">给笔记本起个名字，例如「刑法」「法理学」「我的冲刺本」。</div>
      <input id="nb-name" class="add-input" placeholder="笔记本名称">
      <div class="add-actions">
        <button onclick="closeNbModal()">取消</button>
        <button class="primary" onclick="createNotebook()">创建</button>
      </div>
      <div class="add-msg" id="nb-msg"></div>
    </div>
  </div>
</div>
<script>
// Auto-generated card data. Blanks marked as {{answer}}.
// Pipeline: preserve ids, only append new ones.

const SUBJECTS = [
  {
    id: 'falixue',
    name: '法理学',
    colorA: '#4a6cf7',
    colorB: '#2541b2',
    cards: [
      { id: 'falixue_1', title: '法律规则的逻辑结构', definition: '通说认为法律规则由{{假定条件}}、{{行为模式}}、{{法律后果}}三要素构成。', example: '《刑法》第232条"故意杀人的，处死刑……"中，"故意杀人"是假定条件与行为模式，"处死刑……"是法律后果。' },
      { id: 'falixue_2', title: '授权性规则', definition: '规定主体{{可以作出或不作出}}一定行为，或{{有权要求}}他人作出或不作出一定行为的规则。', example: '《民法典》第240条"所有权人对自己的不动产或者动产，依法享有占有、使用、收益和处分的权利"。' },
      { id: 'falixue_3', title: '义务性规则', definition: '规定主体{{必须作出或禁止作出}}一定行为的规则，包括{{命令性规则}}和{{禁止性规则}}。', example: '"应当依法纳税""禁止故意杀人"。' },
      { id: 'falixue_4', title: '确定性规则', definition: '内容{{明确肯定}}，可直接适用，{{无需援引其他规定}}的规则。', example: '《刑法》第232条故意杀人罪的处罚规定。' },
      { id: 'falixue_5', title: '委任性规则', definition: '内容{{尚未确定}}，授权{{其他机关}}制定具体规定的规则。', example: '"具体办法由国务院另行规定"。' },
      { id: 'falixue_6', title: '准用性规则', definition: '内容{{不完整}}，{{援引其他条文}}加以适用的规则。', example: '"本法没有规定的，适用……的规定"。' },
      { id: 'falixue_7', title: '任意性规则', definition: '允许当事人通过{{约定排除或变更}}其适用的规则。', example: '《民法典》合同编中"当事人另有约定的除外"。' },
      { id: 'falixue_8', title: '调整性规则与构成性规则', definition: '{{调整性规则}}：对已有行为进行规范。{{构成性规则}}：先有规则才有该行为。', example: '调整性规则：交通规则。构成性规则：象棋规则、合同成立规则。' },
      { id: 'falixue_9', title: '法律保留', definition: '某些事项{{只能由法律规定}}，行政机关{{未经法律授权不得自行规定}}。', example: '《立法法》第8条列举的犯罪与刑罚、限制人身自由的处罚等只能制定法律。' },
      { id: 'falixue_10', title: '授权立法', definition: '立法机关通过授权决定，将部分立法权授予{{行政机关}}等行使。', example: '1985年全国人大授权国务院在经济体制改革方面制定暂行规定。' },
      { id: 'falixue_11', title: '价值位阶原则', definition: '不同位阶的法律价值冲突时，{{高位阶价值优先}}。位阶顺序：{{自由}} > {{正义}} > {{秩序}}。', example: '限制人身自由须有法律依据。' },
      { id: 'falixue_12', title: '个案平衡原则', definition: '{{同一位阶}}的法律价值冲突时，结合具体案情{{综合权衡}}。', example: '言论自由与名誉权冲突时，法院根据发帖内容、恶意程度等具体判断。' },
      { id: 'falixue_13', title: '比例原则', definition: '目的与手段之间应{{适当、必要、均衡}}。', example: '为防疫限制出行，应选择对权利损害最小的手段。' },
      { id: 'falixue_14', title: '法学流派代表人物', definition: '自然法学派：{{洛克、孟德斯鸠、卢梭、富勒、罗尔斯、德沃金}}。分析法学派：{{边沁、奥斯丁、凯尔森、哈特}}。社会法学派：{{埃利希、耶林、庞德}}。历史法学派：{{萨维尼、梅因}}。哲理法学派：{{康德、黑格尔}}。', example: '考试常考各派代表人，尤其是自然法学派与分析法学派的区分。' },
      { id: 'falixue_15', title: '准民事法律行为', definition: '有{{意思表示}}，但法律效果由{{法律直接规定}}，而非按意思表示内容发生。', example: '催告、债权转让通知、拒绝要约。' },
      { id: 'falixue_16', title: '事实行为', definition: '{{无需意思表示}}，法律直接根据客观行为或结果赋予法律后果。', example: '创作作品、拾得遗失物、合法建造房屋。' },
      { id: 'falixue_17', title: '民事法律行为', definition: '以{{意思表示为要素}}，按意思表示内容发生法律效果的行为。', example: '签订合同、立遗嘱。' },
      { id: 'falixue_18', title: '民事法律关系', definition: '由民法规范调整的、以{{民事权利和民事义务}}为内容的社会关系。', example: '合同关系、所有权关系。' },
      { id: 'falixue_19', title: '民事权利非法律关系变动基本条件', definition: '民事权利是法律关系的{{内容和结果}}；法律关系变动的基本条件是{{法律规范}}和{{法律事实}}。', example: '签订合同（法律事实）产生合同关系，才产生合同债权。' }
    ]
  },
  {
    id: 'xianfa',
    name: '宪法',
    colorA: '#c0392b',
    colorB: '#922b21',
    cards: [
      { id: 'xianfa_1', title: '国务院组成人员', definition: '总理、{{副总理}}、{{国务委员}}、各部部长、各委员会主任、{{中国人民银行行长}}、{{审计长}}、秘书长。', example: '国家金融监督管理总局局长、证监会主席不是国务院组成人员。' },
      { id: 'xianfa_2', title: '全国人大常委会工作机构', definition: '为常委会行使职权提供辅助、服务、保障的机构，{{不能独立行使国家权力}}。', example: '办公厅、法制工作委员会、预算工作委员会、代表资格审查委员会。' },
      { id: 'xianfa_3', title: '特别行政区外交事务', definition: '与特别行政区有关的外交事务由{{中央人民政府}}负责管理。', example: '外交部在特别行政区设立机构；特别行政区可在中央授权下处理对外事务。' },
      { id: 'xianfa_4', title: '1982年宪法城市土地归属', definition: '{{1982年宪法}}首次规定"城市的土地{{属于国家所有}}"（第10条第1款）。', example: '城市市区土地一律属国家所有。' },
      { id: 'xianfa_5', title: '城市郊区土地所有权', definition: '城市郊区的土地，除由法律规定属于国家所有的以外，属于{{集体所有}}。', example: '郊区某村土地，若无法律特别规定，归农民集体所有。' },
      { id: 'xianfa_6', title: '被剥夺政治权利者不得服兵役', definition: '《兵役法》第5条规定，被剥夺政治权利的公民{{不得服兵役}}。', example: '某人因犯罪被判处剥夺政治权利三年，期间不能参军。' },
      { id: 'xianfa_7', title: '基本法律', definition: '由{{全国人民代表大会}}制定和修改的、规定国家某方面基本制度的法律。', example: '《刑法》《民法典》《刑事诉讼法》《香港特别行政区基本法》。' },
      { id: 'xianfa_8', title: '司法机关范围', definition: '狭义：{{人民法院、人民检察院}}。广义：还包括{{公安机关、国家安全机关、司法行政机关}}等。{{监察委员会}}不是司法机关。', example: '监察委员会行使监察权，不属于司法机关。' },
      { id: 'xianfa_9', title: '最高人民法院巡回法庭', definition: '最高人民法院派出机构，目前设{{6个}}。', example: '第一巡回法庭在深圳，巡回区为广东、广西、海南、湖南。' },
      { id: 'xianfa_10', title: '全国人大常委会工作机构与专门委员会区别', definition: '工作机构：{{辅助性}}，不能独立行权，由常委会领导。专门委员会：全国人大设立，大会期间受{{大会}}领导，闭会期间受{{常委会}}领导，可在法定范围内行使审议等职权。', example: '专委会可独立行使部分职权，工作机构不能。' }
    ]
  },
  {
    id: 'fazhishi',
    name: '法制史',
    colorA: '#7d6608',
    colorB: '#5d4e08',
    cards: [
      { id: 'fazhishi_1', title: '五过之疵', definition: '西周对司法官徇私枉法五种情形的追责：{{惟官}}、{{惟反}}、{{惟内}}、{{惟货}}、{{惟来}}。', example: '司法官因收受贿赂而枉法裁判，与罪犯同罪。' },
      { id: 'fazhishi_2', title: '嘉石之制', definition: '西周对轻微违法者{{坐嘉石示众}}并服劳役的制度。', example: '轻罪犯坐嘉石3至13日，再服劳役3个月至1年。' },
      { id: 'fazhishi_3', title: '坐赃', definition: '唐律{{六赃}}之一，非监临主司{{因事受财}}，按赃值治罪。', example: '非主管官员因帮忙办事收受财物，构成坐赃。' },
      { id: 'fazhishi_4', title: '七出、三不去、义绝、和离', definition: '{{七出}}：丈夫休妻的七种理由（不顺父母、无子、淫、妒、有恶疾、口多言、窃盗）。{{三不去}}：有所取无所归、与更三年丧、前贫贱后富贵。{{义绝}}：强制离婚。{{和离}}：夫妻自愿协议离婚。', example: '义绝是强制性离婚，当事人不得拒绝；和离是协议性离婚。' },
      { id: 'fazhishi_5', title: '开皇律', definition: '{{隋朝}}法典，{{12篇500条}}，正式确立{{封建制五刑}}和{{十恶}}。', example: '笞、杖、徒、流、死；十恶不赦。' },
      { id: 'fazhishi_6', title: '吕刑', definition: '{{西周穆王}}命{{吕侯}}制定，我国{{现存最早}}刑法文献，确立赎刑、五过之疵等。', example: '"五刑之疑有赦，五罚之疑有赦"。' },
      { id: 'fazhishi_7', title: '刑罚世轻世重', definition: '刑罚轻重随社会治乱调整：新国用{{轻典}}，平国用{{中典}}，乱国用{{重典}}。', example: '《周礼》三典。' },
      { id: 'fazhishi_8', title: '唐律五刑二十等', definition: '笞{{五等}}、杖{{五等}}、徒{{五等}}、流{{三等}}、死{{二等}}。', example: '徒一年减一等为杖一百。' },
      { id: 'fazhishi_9', title: '八议', definition: '{{八}}种特权人物犯罪可减免刑罚：亲、故、贤、能、功、贵、勤、宾。', example: '八议者犯流以下罪减一等，十恶不用。' },
      { id: 'fazhishi_10', title: '加役流', definition: '流{{三千里}}并居作{{三年}}，{{唐太宗}}为宽减死刑而设。', example: '原判死刑改为加役流。' },
      { id: 'fazhishi_11', title: '宋朝差遣制', definition: '官员{{官品与实际职务分离}}，差遣为实际职务。', example: '知州、知县均为差遣。' },
      { id: 'fazhishi_12', title: '贼配军（刺配）', definition: '宋元对刺配刑犯人的蔑称，刺配集{{杖、墨、流}}于一体。', example: '《水浒传》中林冲被刺配沧州。' },
      { id: 'fazhishi_13', title: '宣政院', definition: '{{元朝}}管理全国佛教及{{西藏军政事务}}的中央机构，仅元朝有。', example: '元朝设宣政院管辖吐蕃。' },
      { id: 'fazhishi_14', title: '纵囚枉法', definition: '古代司法官{{故意放纵罪犯、枉法裁判}}的行为，秦汉已有，唐代发展为{{出入人罪}}。', example: '秦简"纵囚"指当论而端弗论。' },
      { id: 'fazhishi_15', title: '中华苏维埃共和国宪法大纲', definition: '{{1931年11月7日}}通过，中国历史上{{第一部人民政权宪法性文件}}。', example: '1934年修改。' },
      { id: 'fazhishi_16', title: '化外人犯罪', definition: '唐律规定，{{同类}}外国人相犯各依{{本俗法}}，{{异类}}相犯以{{唐律}}论。', example: '两个波斯人相犯依波斯法，波斯人与唐人相犯依唐律。' },
      { id: 'fazhishi_17', title: '1923年贿选宪法', definition: '{{曹锟}}贿选后颁布，中国近代史上{{第一部正式颁行的宪法}}，又称"{{双十宪法}}"。', example: '又称"曹锟宪法"，1923年10月10日颁布，故称双十宪法。' }
    ]
  },
  {
    id: 'xingfa',
    name: '刑法',
    colorA: '#1a6f3a',
    colorB: '#0d4a26',
    cards: [
      { id: 'xingfa_1', title: '累犯', definition: '一般累犯：前罪{{有期徒刑以上}}，执行完毕或赦免后{{五年内}}再犯。特别累犯：危害国家安全等三类犯罪，{{任何时候}}再犯同类罪均构成。', example: '前罪缓刑，不构成累犯（缓刑考验期满刑罚不再执行）。' },
      { id: 'xingfa_2', title: '减刑、假释限制', definition: '{{累犯}}可以减刑，但{{不得假释}}；{{终身监禁}}不得减刑、假释。', example: '无期徒刑假释考验期为十年。' },
      { id: 'xingfa_3', title: '数罪并罚：漏罪与新罪', definition: '第70条（漏罪）：{{先并后减}}。第71条（新罪）：{{先减后并}}。', example: '服刑期间发现漏罪，先并后减；又犯新罪，先减后并。' },
      { id: 'xingfa_4', title: '吸收原则与限制加重原则', definition: '吸收原则：{{死刑、无期徒刑}}吸收其他刑罚。限制加重：总和{{35年以上}}最高不超过{{25年}}。', example: '总和刑期35年以上，最高不超过25年。' },
      { id: 'xingfa_5', title: '罚金刑', definition: '选处罚金：与自由刑{{二选一}}。并处或单处：判主刑必须{{并处}}罚金，或单独罚金。', example: '侵占罪"处二年以下有期徒刑、拘役或者罚金"。' },
      { id: 'xingfa_6', title: '剥夺政治权利', definition: '剥夺{{选举权、被选举权、言论自由}}等权利。被剥夺者{{不得服兵役}}，但{{可担任公司经理}}。', example: '剥夺政治权利不影响私权活动。' },
      { id: 'xingfa_7', title: '管制禁止令与从业禁止', definition: '管制禁止令：由{{社区矫正机构}}执行。从业禁止：刑罚执行完毕或假释后，{{3至5年}}，特殊领域可{{终身}}。', example: '证券从业人员犯罪，出狱后3至5年禁止从事证券业。' },
      { id: 'xingfa_8', title: '监外执行情形', definition: '严重疾病需{{保外就医}}、{{怀孕或哺乳}}、生活{{不能自理}}。', example: '符合上述情形的罪犯可申请监外执行。' },

// ---- Auth helpers ----
function authHeaders() {
  return { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' };
}
function getSession() {
  try { return JSON.parse(localStorage.getItem(AUTH_STORAGE))||null; } catch { return null; }
}
function setSession(s) {
  if (s) localStorage.setItem(AUTH_STORAGE, JSON.stringify(s));
  else localStorage.removeItem(AUTH_STORAGE);
}

// 恢复会话（不校验过期——需要时云端会报 401）
let session = getSession();

// 当前用户邮箱（显示用）
function currentEmail() { return session ? (session.user && session.user.email) : ''; }

// =====================================================
// 云端数据行（progress 表）：{ id: auth_uid, data: {...} }
// data = {
//   notebooks: [{id, name, cards: [{id,title,definition,example}]}],
//   progress: { [cardId]: {stars, mastered} }   // cardId = 'nbId:cardIndex' 或内置
// }
// =====================================================
let cloudData = null;      // 当前用户全量数据 {notebooks, progress}
let offlineQueue = 0;      // 未推送的操作数（简化：失败时标记，下次重推）

function emptyUserData() { return { notebooks: [], progress: {} }; }
function currentData() { return cloudData || emptyUserData(); }

// ---- 云端读（登录后拉全量）----
async function fetchUserData() {
  const uid = session.user.id;
  const r = await fetch(`${SUPABASE_URL}/rest/v1/progress?id=eq.${encodeURIComponent(uid)}&select=id,data`, {
    headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer '+session.access_token }
  });
  if (r.status===401) throw new Error('SESSION_EXPIRED');
  if (!r.ok) throw new Error('read HTTP '+r.status);
  const rows = await r.json();
  return rows && rows.length ? (rows[0].data || emptyUserData()) : emptyUserData();
}

// ---- 云端写（全量覆盖本用户行）----
async function pushUserData() {
  if (!session) return;
  const uid = session.user.id;
  const body = { data: currentData() };
  const r = await fetch(`${SUPABASE_URL}/rest/v1/progress?id=eq.${encodeURIComponent(uid)}`, {
    method: 'PUT',
    headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer '+session.access_token, 'Content-Type':'application/json', Prefer:'return=representation' },
    body: JSON.stringify(body)
  });
  if (r.ok) { offlineQueue = 0; return; }
  if (r.status===404) { // 行不存在 → INSERT
    const r2 = await fetch(`${SUPABASE_URL}/rest/v1/progress`, {
      method: 'POST',
      headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer '+session.access_token, 'Content-Type':'application/json', Prefer:'return=representation' },
      body: JSON.stringify({ id: uid, ...body })
    });
    if (r2.ok) { offlineQueue = 0; return; }
    throw new Error('insert HTTP '+r2.status);
  }
  throw new Error('push HTTP '+r.status);
}

// 本地渲染照常，云端尽力推送（失败静默，下次操作重推）
function persist() {
  try { localStorage.setItem(USER_DATA_STORAGE, JSON.stringify(currentData())); } catch {}
  if (!session) return;
  pushUserData().catch(e=>{ offlineQueue++; console.warn('push fail', e); });
}

let authMode = 'signup'; // 'signup' | 'login'

function showAuth() {
  document.getElementById('auth-view').style.display='flex';
  document.getElementById('home-view').style.display='none';
  document.getElementById('card-view').style.display='none';
}
function showHome() {
  document.getElementById('auth-view').style.display='none';
  document.getElementById('card-view').style.display='none';
  document.getElementById('home-view').style.display='block';
  renderHome();
}
function authToggle() {
  authMode = authMode==='signup' ? 'login' : 'signup';
  document.getElementById('auth-submit').textContent =
    authMode==='signup' ? '注册并登录' : '登录';
  document.querySelector('.auth-toggle').innerHTML =
    authMode==='signup' ? '已有账号？<a onclick="authToggle()">直接登录</a>'
                        : '没有账号？<a onclick="authToggle()">注册</a>';
  document.getElementById('auth-msg').textContent='';
}

async function authSubmit() {
  const email = document.getElementById('auth-email').value.trim();
  const pass = document.getElementById('auth-pass').value;
  const msg = document.getElementById('auth-msg');
  if (!email || !pass) { msg.textContent='请输入邮箱和密码'; return; }
  if (pass.length < 6) { msg.textContent='密码至少6位'; return; }
  msg.textContent = authMode==='signup' ? '注册中…' : '登录中…';
  try {
    if (authMode==='signup') {
      const r = await fetch(`${SUPABASE_URL}/auth/v1/signup`, {
        method:'POST', headers: authHeaders(), body: JSON.stringify({ email, password: pass })
      });
      const j = await r.json();
      if (!r.ok) { msg.textContent = j.error_description || j.msg || '注册失败'; return; }
      // signup 可能直接返回 session（autoconfirm on）或只有 user（需邮箱确认）
      if (j.access_token) {
        session = j; setSession(j); await afterLogin(); return;
      }
      msg.textContent = '注册成功！请到邮箱点击确认链接后重新登录';
      authMode='login'; authToggle();
    } else {
      const r = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
        method:'POST', headers: authHeaders(), body: JSON.stringify({ email, password: pass })
      });
      const j = await r.json();
      if (!r.ok) { msg.textContent = j.error_description || j.msg || '登录失败'; return; }
      session = j; setSession(j); await afterLogin();
    }
  } catch(e) { msg.textContent = '网络错误：'+e.message; }
}

function logout() {
  if (!confirm('确定退出登录？本机将清除当前账号的缓存数据。')) return;
  setSession(null);
  session = null;
  cloudData = null;
  try { localStorage.removeItem(USER_DATA_STORAGE); } catch {}
  showAuth();
}

// 登录成功后：拉云端 → 没有就初始化 → 进首页
async function afterLogin() {
  try {
    let d = null;
    try { d = await fetchUserData(); } catch(e) {
      if (e.message==='SESSION_EXPIRED') {
        setSession(null); session=null;
        document.getElementById('auth-msg').textContent='登录已过期，请重新登录';
        showAuth(); return;
      }
      throw e;
    }
    // 本地缓存合并：云端空 → 用本地（可能是离线创建的）；两边都有 → 合并（本地进度并集）
    let local = null;
    try { local = JSON.parse(localStorage.getItem(USER_DATA_STORAGE)); } catch {}
    if (!d.notebooks || !d.notebooks.length) {
      cloudData = local && local.notebooks && local.notebooks.length ? local : emptyUserData();
    } else if (local && local.progress) {
      // 合并进度（本地 + 云端，云端优先）
      d.progress = Object.assign({}, local.progress, d.progress||{});
      cloudData = d;
    } else {
      cloudData = d;
    }
    persist();
    showHome();
  } catch(e) {
    document.getElementById('auth-msg').textContent = '加载数据失败：'+e.message;
  }
}

  if (!name) { msg.textContent='请输入笔记本名称'; return; }
  if (allNotebooks().some(n=>n.name===name)) { msg.textContent='已存在同名笔记本'; return; }
  const id = 'nb_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  cloudData.notebooks.push({ id, name, cards: [] });
  persist();
  closeNbModal();
  renderHome();
}

function deleteNotebook(nid) {
  const nb = findNotebook(nid);
  if (!nb) return;
  if (!confirm(`确定删除笔记本「${nb.name}」？其中 ${(nb.cards||[]).length} 张卡片会一并删除，不可恢复。`)) return;
  cloudData.notebooks = cloudData.notebooks.filter(n=>n.id!==nid);
  // 清理进度
  const p = cloudData.progress || {};
  for (const k of Object.keys(p)) if (k.startsWith(nid+':')||k.startsWith(nid+'_')) delete p[k];
  persist();
  renderHome();
}

// 笔记本配色（封面莫兰迪色板）
const PALETTES = [
  { coverBgGrad:'linear-gradient(145deg,#e2e6ea,#cfd8e0)', coverTint:'rgba(110,143,163,0.16)', coverDark:'#55728a', coverMid:'#7d93a8', coverTrack:'rgba(110,143,163,0.3)', accent:'#6e8fa3', accentRev:'#3d6478' },
  { coverBgGrad:'linear-gradient(145deg,#e9e0dd,#ddd0cc)', coverTint:'rgba(176,112,112,0.16)', coverDark:'#9c5a5a', coverMid:'#bd8a8a', coverTrack:'rgba(176,112,112,0.3)', accent:'#b07070', accentRev:'#7a3e3e' },
  { coverBgGrad:'linear-gradient(145deg,#ece5d8,#e0d5c2)', coverTint:'rgba(160,136,88,0.16)', coverDark:'#8a7446', coverMid:'#b09a70', coverTrack:'rgba(160,136,88,0.3)', accent:'#a08858', accentRev:'#6e5c2e' },
  { coverBgGrad:'linear-gradient(145deg,#e4e9df,#d6ddd0)', coverTint:'rgba(110,148,114,0.16)', coverDark:'#5d7f61', coverMid:'#8aa58e', coverTrack:'rgba(110,148,114,0.3)', accent:'#6e9472', accentRev:'#3e6442' },
  { coverBgGrad:'linear-gradient(145deg,#ebe7f0,#ddd6e4)', coverTint:'rgba(136,120,168,0.16)', coverDark:'#7a6a96', coverMid:'#a090b8', coverTrack:'rgba(136,120,168,0.3)', accent:'#8878a8', accentRev:'#5a4a7a' },
  { coverBgGrad:'linear-gradient(145deg,#e2e8e6,#d3deda)', coverTint:'rgba(94,142,142,0.16)', coverDark:'#4e7a7a', coverMid:'#7fa0a0', coverTrack:'rgba(94,142,142,0.3)', accent:'#5e8e8e', accentRev:'#2e5e5e' }
];
function paletteOf(nid) {
  const nb = findNotebook(nid);
  const idx = nb && nb._paletteIdx!=null ? nb._paletteIdx : (allNotebooks().indexOf(nb) % PALETTES.length);
  return PALETTES[idx] || PALETTES[0];
}
function paletteCssVars(nid) {
  const p = paletteOf(nid);
  return `--accent:${p.accent};--accent-bg:rgba(${hexToRgb(p.accent)},0.13);--accent-rev:${p.accentRev};--cover-tint:${p.coverTint};--cover-dark:${p.coverDark};--cover-mid:${p.coverMid};--cover-track:${p.coverTrack}`;
}
function hexToRgb(h) {
  const n = parseInt(h.slice(1),16);
  return [(n>>16)&255, (n>>8)&255, n&255].join(',');
}

// 系统笔记本：已掌握 / 新添加（不与用户笔记本混存）
const MASTERED_NB = '__mastered__';
const ADDED_NB = '__added__';
function subjectOfCard(card) { return card._sourceNotebook || '未分类'; }
function allUserCards() {
  const rows=[];
  for (const nb of allNotebooks()) for (const c of (nb.cards||[])) rows.push({...c,_sourceNotebook:nb.name,_sourceNotebookId:nb.id});
  return rows;
}
function masteredCards() { return allUserCards().filter(c=>getProgress(c.id).mastered); }
function addedCards() { return allUserCards().filter(c=>c._addedAt); }
function systemCards(nid) { return nid===MASTERED_NB ? masteredCards() : nid===ADDED_NB ? addedCards() : []; }
function notebookDisplayName(nid) {

}

}

function renderCardView() {
  const cv = document.getElementById('card-view');

  const total = currentCards.length;

  const pal = paletteOf(currentNotebookId);

    const mastered = getProgress(card.id).mastered;

      <div class="card-title-bar" style="background:linear-gradient(135deg,${lighten(pal.accent)},${pal.accent})">
        <div class="card-title">${escHtml(card.title)}</div>
      </div>
      <div class="card-body">
        <div class="section-label">定义</div>

        ${exHtml}
      </div>
      <div class="card-controls">
        <button class="reveal-toggle-btn" onclick="toggleAll()">${ar?'收起答案':'显示全部'}</button>
        <div class="star-row">${starsHtml}</div>
        <button class="discard-btn${mastered?' restore':''}" onclick="toggleMastered()">${mastered?'↩ 移回':'✓ 掌握'}</button>
        ${currentNotebookId===ADDED_NB?`<button class="discard-btn del" onclick="confirmDeleteCard()">🗑 删除</button>`:''}
      </div>

  }

  cv.style.setProperty('--accent', pal.accent);
  const hint = !swipeHintShown ? `<div class="swipe-hint">← 左右滑动翻页 →</div>` : '';

    <div class="card-header">
      <button class="back-btn" onclick="goHome()">←</button>

    </div>
    ${renderSystemBatchTools()}

    <div class="card-nav">
      <button class="nav-btn" onclick="navigate(-1)" ${currentIndex===0?'disabled':''}>‹</button>
      <div class="nav-slider">
        ${total>1?`<input type="range" min="0" max="${total-1}" value="${currentIndex}"
          id="nav-slider" style="--fill:${total>1?(currentIndex/(total-1)*100):0}%"
          oninput="onSliderInput(this)" onchange="onSliderChange(this)">`:''}
        <div class="nav-count">${total>0?(currentIndex+1)+'/'+total:'0/0'}</div>

      <button class="nav-btn" onclick="navigate(1)" ${!card||currentIndex>=total-1?'disabled':''}>›</button>

function lighten(hex) {
  // 简单提亮
  const n = parseInt(hex.slice(1),16);
  const r=Math.min(255,(n>>16)&255|0), g=Math.min(255,(((n>>8)&255)+40)|0), b=Math.min(255,((n&255)+40)|0);
  return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
}

// =====================================================
// 卡片操作
// =====================================================
function setStar(n) {
  const card = currentCards[currentIndex];
  if (!card) return;
  const cur = getProgress(card.id).stars;
  setProgress(card.id, { stars: cur===n ? 0 : n });
  renderCardView();
}
function toggleMastered() {
  const card = currentCards[currentIndex];
  if (!card) return;
  const mastered = getProgress(card.id).mastered;
  setProgress(card.id, { mastered: !mastered });
  if (currentNotebookId===MASTERED_NB || currentNotebookId===ADDED_NB) {
    setTimeout(()=>{ currentCards=systemCards(currentNotebookId); if(currentIndex>=currentCards.length) currentIndex=Math.max(0,currentCards.length-1); renderCardView(); renderHome(); },120);
    return;
  }
  if (!mastered) { // 标记掌握 → 庆祝动效
    const paper = document.getElementById('card-paper');
    if (paper) {
      paper.classList.add('paper-exit');
      celebrate();
      setTimeout(()=>{ renderCardView(); }, 420);
      return;
    }
  }
  renderCardView();
}
function celebrate() {
  const ov = document.createElement('div');
  ov.className='celebrate-overlay';
  ov.innerHTML='<div class="celebrate-pop">🎉 已掌握！</div>';
  document.body.appendChild(ov);
  setTimeout(()=>ov.remove(), 1100);
}

function toggleBlank(el) {
  const bid = el.dataset.bid;
  if (revealed.has(bid)) revealed.delete(bid); else revealed.add(bid);
  const defText = document.getElementById('def-text');
  if (defText) defText.innerHTML = renderBlanks(currentCards[currentIndex].definition, revealed);
  const btn = document.querySelector('.reveal-toggle-btn');
  if (btn && currentCards[currentIndex]) btn.textContent = allRevealed(currentCards[currentIndex].definition, revealed)?'收起答案':'显示全部';
}
function toggleAll() {
  const card = currentCards[currentIndex];
  if (!card) return;
  const ms = [...card.definition.matchAll(/\{\{([^}]+)\}\}/g)];
  if (allRevealed(card.definition, revealed)) revealed.clear();
  else for (const m of ms) revealed.add(blankId(m[1]));
  renderCardView();
}

// =====================================================
// 导航
// =====================================================
function _goToCard(idx, direction, delay) {
  currentIndex = idx;
  revealed = new Set();
  if (direction && delay) {
    const paper = document.getElementById('card-paper');
    if (paper) {
      paper.classList.add(direction>0?'slide-out-left':'slide-out-right');
      setTimeout(()=>{ renderCardView(); }, delay);
      return;
    }
  }
  renderCardView();
}
function sliderJump(v) {
  const idx = parseInt(v,10);
  if (isNaN(idx)||idx<0||idx>=currentCards.length) return;
  if (idx===currentIndex) { renderCardView(); return; }
  const dir = idx>currentIndex?1:-1;
  _goToCard(idx, dir, 80);
}
function onSliderInput(el) {
  const idx = parseInt(el.value,10);
  el.style.setProperty('--fill', (idx/(currentCards.length-1)*100)+'%');
  const cnt = document.querySelector('.nav-count');
  if (cnt) cnt.textContent = (idx+1)+'/'+currentCards.length;
}
function onSliderChange(el) { sliderJump(el.value); }
function navigate(dir) {
  const ni = currentIndex+dir;
  if (ni<0||ni>=currentCards.length) return;
  _goToCard(ni, dir, 120);
}

// swipe
let _tx=0,_ty=0,_swiping=false;
document.addEventListener('touchstart', e=>{
  if (e.target.closest('input,button,.blank')) return;
  _tx=e.touches[0].clientX; _ty=e.touches[0].clientY; _swiping=true;
},{passive:true});
document.addEventListener('touchmove', e=>{
  if (!_swiping) return;
  const dx=e.touches[0].clientX-_tx, dy=e.touches[0].clientY-_ty;
  if (Math.abs(dy)>Math.abs(dx)*1.2) { _swiping=false; return; }
},{passive:true});
document.addEventListener('touchend', e=>{
  if (!_swiping) return;
  _swiping=false;
  const dx=e.changedTouches[0].clientX-_tx;
  if (dx>52) navigate(-1);
  else if (dx<-52) navigate(1);
},{passive:true});

// =====================================================
// 挖空渲染
// =====================================================
function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function blankId(answer) {
  let h=0; for (let i=0;i<answer.length;i++) h=(Math.imul(31,h)+answer.charCodeAt(i))|0;
  return 'b'+(h>>>0).toString(36);
}
function makeDashes(answer) {
  const n = Math.max(2, Math.ceil(answer.length/2));
  return '—'.repeat(n);
}
function renderBlanks(text, revealedSet) {
  return String(text||'').replace(/\{\{([^}]+)\}\}/g, (_,answer)=>{
    const id = blankId(answer);
    const revealed = revealedSet.has(id);
    const dashes = makeDashes(answer);
    return `<span class="blank${revealed?' revealed':''}" data-answer="${escHtml(answer)}" data-bid="${id}" data-dashes="${revealed?'':dashes}" onclick="toggleBlank(this)">${revealed?escHtml(answer):''}</span>`;
  });
}
function allRevealed(definition, revealedSet) {
  const ms = [...String(definition||'').matchAll(/\{\{([^}]+)\}\}/g)];
  return ms.length===0 || ms.every(m=>revealedSet.has(blankId(m[1])));
}

// =====================================================
// 添加知识点（录入当前笔记本）
// =====================================================
function openAdd() {
  document.getElementById('add-modal').classList.add('show');
  renderAddExisting();
  document.getElementById('add-input').value='';
  document.getElementById('add-msg').textContent='';
  renderAddExisting();
}
function closeAdd() {
  document.getElementById('add-modal').classList.remove('show');
  renderHome();
}
function parseAndAdd() {
  const text=document.getElementById('add-input').value.trim(), msg=document.getElementById('add-msg');
  if(!text){msg.textContent='请输入内容';return;}
  const entries=text.split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean);
  let added=0,errors=0;
  const unmatched=[];
  for(const entry of entries){
    const obj={};
    for(const line of entry.split('\n')){const m=line.match(/^\s*(笔记本|知识点|定义|例子)\s*[:：]\s*([\s\S]*)$/);if(m)obj[m[1]]=m[2].trim();}
    if(!obj['知识点']||!obj['定义']){errors++;continue;}
    // 根据「笔记本」字段匹配已有笔记本
    const nbName=obj['笔记本']||'';
    const nb=allNotebooks().find(n=>n.name===nbName);
    if(!nb){unmatched.push(obj['知识点']);continue;}
    nb.cards.push({id:nb.id+'_c'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),title:obj['知识点'],definition:obj['定义'],example:obj['例子']||'',_addedAt:localDateStr()});added++;
  }
  let m=msg.textContent=`✅ 已添加 ${added} 张卡片`;
  if(unmatched.length){m+=`\n⚠ 未匹配到笔记本，跳过 ${unmatched.length} 张：${unmatched.slice(0,4).join('、')}${unmatched.length>4?' 等':''}\n提示：请先在首页创建对应笔记本，或检查「笔记本:」字段名称`;}
  if(errors){m+=`\n⚠ ${errors} 条格式不完整已跳过`;}
  msg.textContent=m;
  if(added){persist();renderAddExisting();renderHome();}
}function localDateStr(){const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function renderAddExisting() {
  const box = document.getElementById('add-existing');
  const nbs = allNotebooks();
  const nb = nbs.length ? nbs[nbs.length-1] : null;
  const cards = nb ? (nb.cards||[]) : [];
  if (!cards.length) {
    box.innerHTML='<div style="font-size:12px;color:var(--ink-soft);padding:4px 0">还没有卡片</div>';
    return;
  }
  let h='';
  for (const c of cards.slice(-30).reverse()) {
    h += `<div class="add-item">
      <div class="info"><div class="t">${escHtml(c.title)}</div><div class="s">${c.example?'有例子':'无例子'} · ${escHtml(nb.name)}</div></div>
      <button class="add-del" onclick="deleteCardById('${escHtml(c.id)}')">✕</button>
    </div>`;
  }
  box.innerHTML=h;
}
function deleteCardById(cid) {
  const nb = currentNotebookId ? findNotebook(currentNotebookId) : null;
  if (!nb) return;
  const card = (nb.cards||[]).find(c=>c.id===cid);
  if (!card) return;
  if (!confirm(`删除「${card.title}」？`)) return;
  nb.cards = nb.cards.filter(c=>c.id!==cid);
  if (cloudData.progress) delete cloudData.progress[cid];
  persist();
  renderAddExisting();
  openNotebook(currentNotebookId);
}

// 删除当前卡片（笔记本视图内）
function confirmDeleteCard() {
  const card = currentCards[currentIndex];
  if (!card) return;
  if (!confirm(`删除「${card.title}」？此操作不可恢复。`)) return;
  const nb = findNotebook(currentNotebookId);
  if (nb) nb.cards = nb.cards.filter(c=>c.id!==card.id);
  if (cloudData.progress) delete cloudData.progress[card.id];
  persist();
  currentCards.splice(currentIndex,1);
  if (currentIndex>=currentCards.length) currentIndex=Math.max(0,currentCards.length-1);
  revealed = new Set();
  renderCardView();
  renderHome();
}

function systemGroups(){
  if(currentNotebookId===MASTERED_NB){
    const g={};for(const c of currentCards){const k=subjectOfCard(c);(g[k]||(g[k]=[])).push(c);}return g;
  }
  if(currentNotebookId===ADDED_NB){
    const g={};for(const c of currentCards){const k=c._addedAt||'未标注';(g[k]||(g[k]=[])).push(c);}return g;
  }
  return {};
}
function renderSystemBatchTools(){
  if(currentNotebookId!==MASTERED_NB && currentNotebookId!==ADDED_NB)return '';
  const isM=currentNotebookId===MASTERED_NB, groups=systemGroups(), keys=Object.keys(groups);
  const opts=keys.map(k=>`<option value="${escHtml(k)}">${escHtml(k)} (${groups[k].length})</option>`).join('');
  return `<div class="system-tools">
    <select id="system-select">${opts}</select>
    ${isM?''
      :`<div class="date-range">
         <input type="date" id="system-date-from" value="">
         <span>至</span>
         <input type="date" id="system-date-to" value="">
       </div>`}
    <button onclick="systemBatchAction()" class="sys-go">${isM?'批量移回':'批量删除'}</button>
  </div>`;
}
function currentSystemSelection(){
  const sel=document.getElementById('system-select');if(!sel)return null;
  return sel.value||null;
}
function systemBatchAction(){
  const key=currentSystemSelection();
  if(!key){alert('请先选择笔记本');return;}
  const isM=currentNotebookId===MASTERED_NB;
  let targets=currentCards.filter(c=>key==='__all__'||(isM?subjectOfCard(c):(c._addedAt||'未标注'))===key);
  // 日期区间过滤（新添加）
  if(!isM){
    const f=document.getElementById('system-date-from')?.value, t=document.getElementById('system-date-to')?.value;
    if(f||t) targets=targets.filter(c=>{
      const d=c._addedAt||''; return (!f||d>=f)&&(!t||d<=t);
    });
  }
  if(!targets.length){alert('没有符合条件的卡片');return;}
  if(!confirm(`确定${isM?'移回':'删除'}选中的 ${targets.length} 张卡片？`))return;
  for(const c of targets){
    if(isM)setProgress(c.id,{mastered:false});
    else{
      const nb=allNotebooks().find(n=>(n.cards||[]).some(x=>x.id===c.id));
      if(nb)nb.cards=nb.cards.filter(x=>x.id!==c.id);
      delete (currentData().progress||{})[c.id];
    }
  }
  persist();currentCards=systemCards(currentNotebookId);currentIndex=0;renderCardView();renderHome();
}
// =====================================================
// 倒计时
// =====================================================
const EXAM_DATE = new Date(2026, 11, 19);
function countdownDays() {
  const now = new Date();
  const diff = new Date(EXAM_DATE.getFullYear(), EXAM_DATE.getMonth(), EXAM_DATE.getDate()) -
               new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.ceil(diff/86400000);
}
function countdownHtml() {
  const d = countdownDays();
  if (d<0) return '<div class="home-countdown">📚 考研已开考</div>';
  if (d===0) return '<div class="home-countdown hot">🎯 就是今天！</div>';
  return `<div class="home-countdown${d<=30?' hot':''}">距考研还有 ${d} 天</div>`;
}

// =====================================================
// INIT
// =====================================================
(async function init() {
  if (session) {
    // 恢复会话 → 拉数据
    try {
      cloudData = await fetchUserData();
      // 合并本地缓存进度
      try {
        const local = JSON.parse(localStorage.getItem(USER_DATA_STORAGE));
        if (local && local.progress && cloudData) {
          cloudData.progress = Object.assign({}, local.progress, cloudData.progress||{});
        }
      } catch {}
      persist();
      showHome();
      return;
    } catch(e) {
      if (e.message==='SESSION_EXPIRED') { setSession(null); session=null; }
      // 其他错误：离线时用缓存
      try {
        const local = JSON.parse(localStorage.getItem(USER_DATA_STORAGE));
        if (local && local.notebooks) {
          cloudData = local;
          showHome();
          document.querySelector('.home-title').insertAdjacentHTML('afterend', '<div style="font-size:11px;color:var(--ink-soft);margin-top:4px">⚠ 离线模式（读缓存）</div>');
          return;
        }
      } catch {}
    }
  }
  showAuth();
})();
